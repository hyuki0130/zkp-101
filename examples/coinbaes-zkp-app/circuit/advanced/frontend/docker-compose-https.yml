services:
  advanced-zkp-frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile.https
    container_name: coinbase-zkp-advanced-frontend-https
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    volumes:
      # Mount SSL certificates
      - ./certs:/etc/nginx/certs:ro
    labels:
      - "com.example.description=Coinbase Attestor Advanced ZKP Frontend (HTTPS)"
      - "com.example.version=1.0.0"
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "--quiet", "--tries=1", "--spider", "https://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
